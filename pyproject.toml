[project]
name = "agentic-rag"
version = "0.1.0"
description = "Enterprise Employee AI Assistant - a local learning project for end-to-end RAG + agentic AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3.6",
    "google-genai>=0.3.0",
    "langchain-core>=0.3.15",
    "langchain-google-genai>=2.0.5",
    "langgraph>=0.2.45",
    "sentence-transformers>=3.2.1",
    "httpx>=0.27",
    "streamlit>=1.39",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "numpy>=1.26",
    "pypdf>=5.0",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2.6",
    "datasets>=3.1.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
include = ["backend*", "mocks*", "eval*", "db*"]
